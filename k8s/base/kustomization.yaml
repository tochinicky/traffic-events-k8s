apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything lands in one namespace; kustomize sets it on every resource.
namespace: traffic-events

labels:
  - pairs:
      app.kubernetes.io/part-of: traffic-events
    includeSelectors: false # selectors are immutable; never let a label change touch them

resources:
  - namespace.yaml
  - app-config.yaml
  - rabbitmq.yaml
  - mongodb.yaml
  - ingest-api.yaml
  - processor.yaml
  - query-api.yaml

# The Secret `traffic-events-secrets` is generated by each overlay (never committed).
