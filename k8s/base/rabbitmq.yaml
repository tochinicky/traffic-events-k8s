# RabbitMQ as a single-replica StatefulSet: a stable pod name (rabbitmq-0) and its own volume,
# which RabbitMQ needs because its data directory is tied to the node name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
data:
  rabbitmq.conf: |
    # Block publishers before the container's memory limit is hit (RabbitMQ reads the cgroup limit).
    vm_memory_high_watermark.relative = 0.6
    # The PVC is small; default disk alarm (50MB) is fine but make it explicit.
    disk_free_limit.absolute = 50MB
    loopback_users.guest = false
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
    - name: prometheus
      port: 15692
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      terminationGracePeriodSeconds: 60 # let RabbitMQ flush queues to disk on shutdown
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: traffic-events-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: traffic-events-secrets
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Startup: first boot (creating the user, enabling plugins) can take a minute on a busy
          # laptop; allow up to 5 minutes before liveness is allowed to kill it.
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            failureThreshold: 60
          # TCP probes on purpose. RabbitMQ opens its AMQP listener only after boot completes, so an
          # open port is a fair "ready" signal. The alternative, `rabbitmq-diagnostics ping`, starts
          # a whole Erlang VM per probe — measurably expensive on a small node.
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
