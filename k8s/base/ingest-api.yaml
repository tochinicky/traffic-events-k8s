# ingest-api: stateless HTTP → RabbitMQ. This file is the fully-commented reference; processor.yaml
# and query-api.yaml follow the same pattern.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
  labels:
    app.kubernetes.io/name: ingest-api
spec:
  replicas: 2 # two pods so a rollout or a node drain never takes the API to zero
  revisionHistoryLimit: 5 # how far back `kubectl rollout undo` can go
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-api # immutable; must match the pod template labels
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # start one new pod above the desired count...
      maxUnavailable: 0 # ...and never remove an old one until a new one is Ready → zero downtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # SIGTERM → (preStop sleep) → app drains → SIGKILL after this many seconds if still running.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true # the chiseled image already runs as UID 1654; this makes it a hard rule
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest-api
          image: traffic-events/ingest-api:dev # tag replaced at deploy time (kustomize `images:`)
          imagePullPolicy: IfNotPresent # images are side-loaded into kind, never pulled
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config # non-secret settings
          env:
            # Credentials come from the Secret; the URI is assembled here with $(VAR) expansion,
            # so the host lives in config and only the credentials are secret.
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: traffic-events-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: traffic-events-secrets
                  key: RABBITMQ_PASSWORD
            - name: RabbitMq__Uri
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):5672/
            - name: Ingest__ApiKey
              valueFrom:
                secretKeyRef:
                  name: traffic-events-secrets
                  key: INGEST_API_KEY
          resources:
            requests: # what the scheduler reserves; also the 100% baseline for HPA CPU percentages
              cpu: 50m
              memory: 128Mi
            limits: # CPU over the limit is throttled; memory over the limit is OOM-killed
              cpu: 500m
              memory: 256Mi
          # Startup: give the app up to 30 × 2s to boot before liveness starts judging it.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Liveness: restart the container if the process is wedged. No dependency checks here —
          # a RabbitMQ outage must not cause a restart storm.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: only receive traffic while RabbitMQ is reachable. Failing pods are removed
          # from the Service endpoints but NOT restarted.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # On termination, endpoints are removed asynchronously. Keep serving for a few seconds so
            # in-flight requests routed to this pod don't fail during a rolling update.
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # .NET needs a writable temp dir; everything else is read-only
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-api
  labels:
    app.kubernetes.io/name: ingest-api
spec:
  selector:
    app.kubernetes.io/name: ingest-api # routes to Ready pods with this label
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Voluntary disruptions (node drain, cluster upgrade) must leave at least one pod serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingest-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-api
